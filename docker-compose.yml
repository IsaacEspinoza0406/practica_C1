services:
  db:
    image: postgres:15-alpine
    container_name: awos_school_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: IsaacMD78
      POSTGRES_DB: school_db
    ports:
      - "5435:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - school-net

  app:
    image: node:20-alpine
    container_name: awos_school_app
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules 
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db
    env_file:
      - .env.local
    networks:
      - school-net

networks:
  school-net:
    driver: bridge